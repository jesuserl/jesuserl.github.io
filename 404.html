<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Jesús Rojas</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .box { max-width: 420px; text-align: center; padding: 2rem; }
  .code { font-family: 'JetBrains Mono', monospace; font-size: 5rem; font-weight: 700; color: var(--accent); line-height: 1; }
  .box p { color: var(--text-dim); margin: 1rem 0 2rem; }
</style>
</head>
<body data-theme="light">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) { /* noop */ }
    if (!t) { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    document.body.dataset.theme = t;
  })();
</script>

<main class="layout-wrapper" style="max-width:420px; margin:0; display:block;">
  <div class="box">
    <div class="avatar-box" style="margin: 0 auto 1.5rem;">404</div>
    <div class="code">404</div>
    <p>La página que buscas no existe o fue movida.</p>
    <a class="download-btn" href="./" style="text-decoration:none;">Volver al inicio</a>
  </div>
</main>
</body>
</html>
